name: Build AC3/DTS plugin
run-name: AC3/DTS x86 Release - ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      only_if_unreleased:
        description: Skip build/release when this commit is already released
        type: boolean
        required: false
        default: false
      release_a_version:
        description: Release a Version (GitHub)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.release_a_version && 'manual-ac3dts-release' || format('manual-ac3dts-build-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  release_check:
    name: Check for unpublished commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release commit inside the publication concurrency group
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY_IF_UNRELEASED: ${{ inputs.only_if_unreleased }}
          RELEASE_REQUESTED: ${{ inputs.release_a_version }}
        run: python3 cmake/check_component_release.py

  build:
    needs: release_check
    if: needs.release_check.outputs.should_build == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Allocate Beijing date version before compilation
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUESTED: ${{ inputs.release_a_version }}
        run: |
          ./cmake/resolve_release_version.ps1 -Repository $env:GITHUB_REPOSITORY `
            -ReleaseRequested:($env:RELEASE_REQUESTED -eq 'true')
      - name: Build, audit imports and package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REQUESTED: ${{ inputs.release_a_version }}
        run: |
          ./build.ps1 -Package -SourcePackage:($env:RELEASE_REQUESTED -eq 'true') -PackageVersion $env:PACKAGE_VERSION
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item -LiteralPath "build/Release/ttp_ac3dts-$env:PACKAGE_VERSION.zip",'build/Release/SHA256SUMS.txt' -Destination artifact
          if ($env:RELEASE_REQUESTED -eq 'true') {
            Copy-Item -LiteralPath "build/Release/ttp_ac3dts-$env:PACKAGE_VERSION-source.zip" -Destination artifact
          }
      # Runtime archives are minimal; releases also attach corresponding GPL source.
      # Private tests and binary reconstruction evidence stay in ../rebuild/tests.
      - uses: actions/upload-artifact@v7
        with:
          name: ttp_ac3dts-x86-Release-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
  github_release:
    needs: build
    if: inputs.release_a_version
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      PREVIOUS_VERSION: ${{ needs.build.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ttp_ac3dts-x86-Release-${{ github.run_number }}
          path: artifact
      - name: Verify package and prepare release notes
        run: |
          ./cmake/prepare_release.ps1 -Version $env:RELEASE_VERSION -PreviousVersion $env:PREVIOUS_VERSION `
            -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -ServerUrl $env:GITHUB_SERVER_URL
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_VERSION" "artifact/ttp_ac3dts-$env:RELEASE_VERSION.zip" `
            "artifact/ttp_ac3dts-$env:RELEASE_VERSION-source.zip" artifact/SHA256SUMS.txt `
            --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" `
            --title "$env:RELEASE_VERSION" --notes-file artifact/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing releases are not overwritten.' }
